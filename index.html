<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 公司发展格局</title>
  </head>
  <body>
    <script>
      // 首屏前定主题，避免深色用户看到闪白。
      // 只两态：已选过就用存量值，否则按系统偏好定一次（之后由用户显式选择）
      (function () {
        try {
          var m = localStorage.getItem('tier-theme');
          var dark = m ? m === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <script>
      // 语言预置：避免英文用户先看到中文
      (function () {
        try {
          var l = localStorage.getItem('tier-lang') || 'zh';
          document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
